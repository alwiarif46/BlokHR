<!--
  modules/setup_wizard/setup_wizard.html

  Template reference for the setup wizard screen.
  The actual HTML is embedded directly in shell.html (#screenSetup)
  because the wizard must be available before any module loader runs.

  4 steps: Type (wzP0) → Branding (wzP1) → Auth (wzP2) → Plan (wzP3).
  This file exists for documentation and test fixtures.
-->
<div id="screenSetup" data-wz-theme="dark">
  <div class="wz-wrap">
    <div class="wz-card">
      <div class="wz-header">
        <div class="wz-title" id="wzTitle">Platform Setup</div>
        <div class="wz-subtitle" id="wzSubtitle">Configure your workspace in 4 quick steps</div>
      </div>
      <div class="wz-steps" id="wzSteps">
        <div class="wz-sn active" id="wzSn1"><span>1</span></div>
        <div class="wz-sl" id="wzSl1"></div>
        <div class="wz-sn" id="wzSn2"><span>2</span></div>
        <div class="wz-sl" id="wzSl2"></div>
        <div class="wz-sn" id="wzSn3"><span>3</span></div>
        <div class="wz-sl" id="wzSl3"></div>
        <div class="wz-sn" id="wzSn4"><span>4</span></div>
      </div>
      <div class="wz-labels" id="wzLabels">
        <div class="wz-lb active" id="wzLb1">Type</div>
        <div class="wz-lb" id="wzLb2">Branding</div>
        <div class="wz-lb" id="wzLb3">Auth</div>
        <div class="wz-lb" id="wzLb4">Plan</div>
      </div>
      <div class="wz-form">
        <div class="wz-panel active" id="wzP0">
          <h3 class="wz-vheading">What are you setting up?</h3>
          <div class="wz-vcards">
            <button type="button" class="wz-vcard" id="wzCardHr" data-vertical="hr">
              <!-- Iconify lucide:building-2 -->
              <svg class="wz-vcard-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                  <path d="M10 12h4m-4-4h4m0 13v-3a2 2 0 0 0-4 0v3" />
                  <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" />
                  <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
                </g>
              </svg>
              <span class="wz-vcard-title">Workforce</span>
            </button>
            <button type="button" class="wz-vcard" id="wzCardSchool" data-vertical="school">
              <!-- Iconify lucide:graduation-cap -->
              <svg class="wz-vcard-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                  <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0zM22 10v6" />
                  <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
                </g>
              </svg>
              <span class="wz-vcard-title">Campus</span>
            </button>
          </div>
          <p class="wz-vwarn">This choice is permanent for this workspace and cannot be changed later.</p>
          <button class="wz-btn wz-btn-p" id="wzBtn0" disabled>
            <span class="btn-text">Continue</span>
          </button>
        </div>
        <div class="wz-panel" id="wzP1">
          <input class="wz-fi" id="wzCompanyName" />
          <button class="wz-btn wz-btn-p" id="wzBtn1" disabled><span class="btn-text">Next</span></button>
        </div>
        <div class="wz-panel" id="wzP2">
          <input type="checkbox" id="wzAuthLocal" checked />
          <input type="checkbox" id="wzAuthMagic" />
          <input id="wzMsalClient" />
          <input id="wzMsalTenant" />
          <input id="wzGoogleClient" />
          <button class="wz-btn wz-btn-g" id="wzBack2">Back</button>
          <button class="wz-btn wz-btn-p" id="wzBtn2"><span class="btn-text">Next</span></button>
        </div>
        <div class="wz-panel" id="wzP3">
          <input class="wz-fi" id="wzAdminEmail" type="email" />
          <textarea id="wzLicenseToken"></textarea>
          <button class="wz-btn wz-btn-g" id="wzBack3">Back</button>
          <button class="wz-btn wz-btn-ok" id="wzBtn3" disabled>
            <span class="btn-text" id="wzBtn3Text">Start trial</span>
          </button>
        </div>
        <div class="wz-success" id="wzSuccess"></div>
      </div>
    </div>
  </div>
</div>
